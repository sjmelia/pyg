[workspace]
members = ["crates/core", "crates/telesema"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = "0.4"
futures-channel = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
telesema-core = { path = "../telesema/rust/crates/core" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

pyg = { path = "crates/core" }
pyg-telesema = { path = "crates/telesema" }
